Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref WebClient
  CognitoDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  ApiBaseUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}'
  CallbackUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}${CallbackPath}'
  LogoutUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}${LogoutPath}'
  FrontendOrigin:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  HostedFrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  RequiredScope:
    Value: !Sub '${ResourceServerIdentifier}/demo.read'
  IssuerUrl:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  ApiId:
    Value: !Ref Api
  ApiStageName:
    Value: !Ref ApiStageName
  DeploymentRegion:
    Value: !Ref AWS::Region
  AssetsTableName:
    Value: !Ref AssetsTable
  AssetPhotoBucketName:
    Value: !Ref AssetPhotoBucket
  BedrockModelId:
    Value: !Ref BedrockModelId
  MaintenanceNotificationsTopicArn:
    Value: !Ref MaintenanceNotificationsTopic
  MaintenanceNotificationsKeyArn:
    Description: Retained customer-managed key for maintenance and alarm messages.
    Value: !GetAtt MaintenanceNotificationsKey.Arn
