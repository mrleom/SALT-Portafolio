  DemoFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: MaintenanceNotificationsTopicPolicy
    Properties:
      AlarmName: !Sub '${AWS::StackName}-demo-errors'
      AlarmDescription: SALT unhandled Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref DemoFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MaintenanceNotificationsTopic]

